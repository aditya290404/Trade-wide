databases:
  # 1. PostgreSQL Database
  - name: tradewide-db
    plan: free
    region: oregon 
    # Or your preferred region

services:
  # 2. Express Backend Server
  - type: web
    name: tradewide-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build && npm run db:push
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tradewide-db
          property: connectionString
      - key: PORT
        value: "3000"
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: "https://tradewide-ui.onrender.com" # Replace after frontend is created if needed
      - key: SENDGRID_API_KEY
        sync: false # User must provide this in the Render dashboard

  # 3. Vite React Frontend
  - type: web
    name: tradewide-ui
    env: static
    plan: free
    rootDir: .
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: tradewide-backend
          property: host
