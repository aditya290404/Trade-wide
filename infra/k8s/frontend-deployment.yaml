apiVersion: apps/v1
kind: Deployment
metadata:
  name: paper-trade-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: paper-trade-frontend
  template:
    metadata:
      labels:
        app: paper-trade-frontend
    spec:
      containers:
        - name: frontend
          image: paper-trade-frontend:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "http://backend-service:5000"
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  type: LoadBalancer
  selector:
    app: paper-trade-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
